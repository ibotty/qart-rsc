[package]
name = "qart-rsc"
version = "0.2.0"
edition = "2024"
description = "Embed an image in a QR code that still scans (port of rsc/qr's qart)"
license = "BSD-3-Clause"
repository = "https://github.com/ibotty/qart-rsc"
readme = "README.md"
keywords = ["qr", "qrcode", "qart", "image"]
categories = ["multimedia::images", "graphics"]
exclude = ["/.github", "/AGENTS.md", "/release.toml", "/renovate.json"]

[dependencies]
image = { version = "0.25.10", default-features = false }
rand = "0.10.3"
thiserror = "2.0.21"

[features]
avif = ["image/avif"]
bmp = ["image/bmp"]
dds = ["image/dds"]
exr = ["image/exr"]
ff = ["image/ff"]
gif = ["image/gif"]
hdr = ["image/hdr"]
ico = ["image/ico"]
jpeg = ["image/jpeg"]
png = ["image/png"]
pnm = ["image/pnm"]
qoi = ["image/qoi"]
tga = ["image/tga"]
tiff = ["image/tiff"]
webp = ["image/webp"]
rayon = ["image/rayon"]
default-formats = ["image/default-formats"]

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
qrcodegen = "1.8.0"
rqrr = "0.11.0"

[profile.dev.package."*"]
opt-level = 3
