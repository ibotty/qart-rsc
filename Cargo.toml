[package]
name = "qart"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
image = { version = "0.25.10", default-features = false }
rand = "0.10.3"
thiserror = "2.0.21"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
qrcodegen = "1.8.0"
rqrr = "0.11.0"

[profile.dev.package."*"]
opt-level = 3
