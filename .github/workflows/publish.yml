name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require a verified annotated tag
        run: |
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi
          read -r verified reason < <(gh api "repos/$REPO/git/tags/$sha" --jq '.verification | "\(.verified) \(.reason)"')
          if [ "$verified" != true ]; then
            echo "::error::$TAG signature not verified by GitHub ($reason)"
            exit 1
          fi

  ci:
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check tag matches crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
